name: Main Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags
          VERSION=$(python3 <<'PYEOF'
          import subprocess, re
          tags_out = subprocess.check_output(['git', 'tag'], text=True).strip()
          tags = [t for t in tags_out.split('\n') if t]
          versions = []
          for tag in tags:
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
          if versions:
              latest = max(versions)
              print(f'{latest[0]}.{latest[1]}.{latest[2]+1}')
          else:
              print('0.0.1')
          PYEOF
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: reg.ci.robertfuller.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            reg.ci.robertfuller.dev/poll-loggy:${{ steps.version.outputs.version }}
            reg.ci.robertfuller.dev/poll-loggy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            reposilite_user=${{ secrets.REPOSILITE_USER }}
            reposilite_password=${{ secrets.REPOSILITE_PASSWORD }}          

      - name: Tag commit with build version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
