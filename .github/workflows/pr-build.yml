name: PR Build

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 23 for x64
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 23
          distribution: 'temurin'
          architecture: x64
          cache: maven
      - name: Run Maven tests
        run: mvn test
  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve or reserve PR version
        id: version
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          git fetch --tags
          EXISTING=$(git tag --list "pr-${PR_NUM}-*" | head -1)
          if [ -n "$EXISTING" ]; then
            VERSION=$(echo "$EXISTING" | sed "s/pr-${PR_NUM}-//")
          else
            VERSION=$(python3 <<'PYEOF'
          import subprocess, re
          tags_out = subprocess.check_output(['git', 'tag'], text=True).strip()
          tags = [t for t in tags_out.split('\n') if t]
          versions = []
          for tag in tags:
              m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
              m = re.match(r'^pr-\d+-(\d+)\.(\d+)\.(\d+)$', tag)
              if m:
                  versions.append(tuple(int(x) for x in m.groups()))
          if versions:
              latest = max(versions)
              print(f'{latest[0]}.{latest[1]}.{latest[2]+1}')
          else:
              print('0.0.1')
          PYEOF
          )
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${VERSION}-pr${PR_NUM}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          registry: reg.ci.robertfuller.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: reg.ci.robertfuller.dev/md-files:${{ steps.version.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
